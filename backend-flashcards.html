rts ORDER BY on the same prefix. It cannot efficiently serve a query filtering only on b or c because the leaf ordering is keyed by a first."},{"term":"Why index (a, b) is not the same as (b, a)","definition":"The B-tree sort order makes the leading column the primary partition. (a, b) clusters all rows with the same `a` together; (b, a) does the opposite. Each helps a different set of predicates and ORDER BYs, and only the matching leading column gets efficient range scans."},{"term":"Selectivity vs cardinality","definition":"Cardinality = number of distinct values in a column; selectivity = fraction of rows a predicate keeps (≈ 1/cardinality for equality on uniform data). High-selectivity (low fraction) predicates benefit most from indexes. Low-cardinality leading columns (boolean, status enum) make poor index leads because each value points to many rows."},{"term":"Index-only scan","definition":"Postgres plan node that answers a query entirely from index pages without heap fetches. Requires that all referenced columns be in the index (key or INCLUDE) AND that the visibility map marks the heap pages as all-visible — otherwise it must do a heap fetch to check MVCC visibility."},{"term":"Visibility map's role in index-only scans","definition":"A per-table bitmap with one bit per heap page indicating \"all tuples on this page are visible to every transaction\". Set by VACUUM. Without it, an index-only scan must still visit the heap to check xmin/xmax, defeating the purpose; that's why frequent VACUUM matters for IOS performance."},{"term":"Bitmap index scan + Bitmap heap scan","definition":"The index scan produces a bitmap of TIDs (sorted by heap page) instead of streaming tuples; the heap scan then visits each heap page once in physical order. Reduces random I/O, combines multiple indexes via BitmapAnd/BitmapOr, and is chosen for mid-selectivity predicates."},{"term":"Index scan vs Seq scan tradeoff","definition":"Index scan wins on selective predicates (small fraction of rows) but does random heap I/O — cost rises sharply with rows returned. Seq scan is sequential I/O, beats index scan once the predicate matches roughly >5-10% of the table. Planner picks based on cost; bad row estimates often misroute the decision."},{"term":"Postgres planner cost model","definition":"Estimates cost in arbitrary units combining `seq_page_cost` (1.0), `random_page_cost` (4.0 by default, often lowered to 1.1 on SSD), `cpu_tuple_cost`, `cpu_index_tuple_cost`, and `cpu_operator_cost`. Picks the lowest-cost plan from those it considers. Cost is an estimate — bad statistics produce bad plans."},{"term":"pg_statistic / pg_stats","definition":"System catalog populated by ANALYZE holding per-column n_distinct, null_frac, MCV list with frequencies, histogram bounds for non-MCV values, and correlation (physical vs logical order). The planner uses these to estimate selectivity. Stale stats are a leading cause of bad plans."},{"term":"MCV (Most Common Values)","definition":"ANALYZE samples the table and records the top-K most frequent values with their exact frequency (default 100, controlled by `default_statistics_target`). Predicates matching an MCV get an exact selectivity estimate; non-MCV values fall back to the histogram. Critical for skewed columns."},{"term":"EXPLAIN ANALYZE: actual vs estimated rows","definition":"Each plan node shows `(cost=… rows=… ) (actual time=… rows=… loops=…)`. A large divergence between estimated and actual rows is the canonical symptom of bad statistics, correlated columns, or missing extended stats — and usually means the planner picked a suboptimal join order or method."},{"term":"EXPLAIN (BUFFERS): shared hit vs read","definition":"`shared hit` = pages found in the buffer cache; `shared read` = pages fetched from OS/disk. High `read` on a hot query suggests cache pressure or first-time access; high `hit` with slow times suggests CPU work in the executor, not I/O. `dirtied`/`written` indicate hint-bit or VACUUM-style side effects."},{"term":"Nested loop join","definition":"For each outer row, probe the inner side. Optimal when the outer side is small and the inner side has a usable index on the join key (turning it into N index lookups). Worst-case O(N×M); planner avoids it when both sides are large unless an index makes inner probes O(log M)."},{"term":"Hash join","definition":"Build an in-memory hash table on the smaller (build) side keyed by the join column, then scan the larger (probe) side hashing each row. O(N+M), excellent for equi-joins on unindexed columns when build side fits in `work_mem`. Spills to disk in batches if not."},{"term":"Merge join","definition":"Both inputs are sorted on the join keys, then walked in lockstep. Linear after sort, and \"free\" when both inputs already come sorted from index scans on the join keys. Best for large pre-sorted equi-joins; supports range joins better than hash join in some engines."},{"term":"When NOT to add an index","definition":"Low-cardinality columns (boolean, status with few values) — bitmap or seq scan beats index. Tables with very high write throughput where the write amplification dominates. Predicates that aren't sargable (function on column, type cast, leading-wildcard LIKE). Tiny tables where seq scan is always cheaper."},{"term":"Sargable predicate","definition":"\"Search ARGument ABLE\": a predicate the optimizer can convert into an index range. `col = ?`, `col > ?`, `col LIKE 'foo%'` are sargable. `f(col) = ?`, `col + 1 = ?`, `col LIKE '%foo'`, and `col::text = ?` (implicit cast on the column) are not — they force a full scan or require an expression index."},{"term":"Write cost of an index","definition":"Each INSERT/DELETE and each UPDATE that touches an indexed column requires one extra B-tree insert (and one delete-marker) per index. HOT updates in Postgres can skip indexes when no indexed column changed and the new tuple fits on the same page. More indexes = more WAL, more bloat, slower writes."},{"term":"HOT updates (Postgres)","definition":"HOT (Heap-Only Tuples) updates optimize PostgreSQL performance by allowing UPDATE operations to completely bypass index writes when no indexed columns are changed and the new row fits on the same data page. Instead of creating new pointers in every index, Postgres links the old row to the new row via an in-page chain, drastically reducing write amplification, WAL volume, and index bloat."},{"term":"CREATE INDEX CONCURRENTLY","definition":"Builds an index without taking an `ACCESS EXCLUSIVE` lock — only a `SHARE UPDATE EXCLUSIVE` lock that allows concurrent DML. Does two table scans and waits for in-progress transactions; takes longer and can leave the index INVALID on failure (requires DROP and retry). Standard practice for production index builds."},{"term":"Index bloat","definition":"Dead/empty space in index pages from MVCC churn, deletes, or non-HOT updates. Pages aren't reclaimed eagerly; over time leaf pages get sparse and the index grows. Diagnose with pgstattuple/pgstatindex; fix with REINDEX (CONCURRENTLY)."},{"term":"Why aren't foreign keys auto-indexed in Postgres?","definition":"The DB only requires an index on the referenced (parent) side (the PK/unique already provides it). The referencing (child) side is not indexed automatically, but you almost always want one: cascading deletes and parent-side updates do a seq scan of the child without it, and JOINs on the FK are slow."},{"term":"Composite PK index vs separate indexes","definition":"A PK on (a, b) creates one B-tree index ordered by (a, b) — it serves `a` predicates and ORDER BY on the prefix, but NOT `b`-only predicates. If you also query by `b`, you need a separate index on (b) or (b, a). Don't assume \"the PK covers everything.\""},{"term":"InnoDB clustered index","definition":"MySQL InnoDB stores table rows in the leaf pages of the primary key's B+ tree — the table IS the PK index. Secondary indexes store the PK value (not a rowid) as the pointer, so lookups via secondary indexes do two B-tree traversals. Postgres uses heap tables; PK is just another B-tree pointing at heap TIDs."},{"term":"LSM-tree vs B-tree tradeoff","definition":"LSM (RocksDB, Cassandra, ScyllaDB): writes buffered in memtable, flushed as sorted SSTables, merged via background compaction — write-optimized, high write amplification, slower point reads via bloom filters. B-tree: in-place updates, read-optimized, lower write throughput. LSM trades read amp + space amp for write amp wins."},{"term":"Read/write/space amplification triangle","definition":"Storage engines can only optimize 2 of 3: read amp (I/O per logical read), write amp (physical bytes written per logical byte), space amp (disk used vs logical data size). B-trees: low read amp, medium write/space amp. LSM: low write amp, higher read+space amp (mitigated by bloom filters and compaction tuning)."},{"term":"MongoDB multikey index","definition":"An index on an array field creates an index entry per array element pointing to the same document. Enables `$in`/equality on array contents. Mongo automatically marks the index multikey on first array insert; can't be undone without rebuild."},{"term":"Why MongoDB forbids parallel multikey fields in a compound index","definition":"A compound index over two array fields would require entries for the Cartesian product of both arrays per document, exploding index size. Mongo allows at most one array field per compound index and rejects inserts that would create parallel arrays."},{"term":"MongoDB hashed index","definition":"Indexes the hash of a field's value; supports equality only (no range). Primary use is as a shard key to spread monotonically increasing fields (like ObjectId or timestamps) evenly across shards, avoiding a hot shard."},{"term":"Skip scan / loose index scan","definition":"Optimization where the engine, lacking a leading-column predicate, jumps between distinct values of the leading column and probes deeper. Effective only when the leading column has low cardinality. Oracle and MySQL 8 support it; Postgres did not until v18 (\"skip scan\") and traditionally workaround was a recursive CTE (\"loose index scan\")."},{"term":"Extended statistics (CREATE STATISTICS)","definition":"Per-column stats assume independence between columns; when two columns are correlated (city, zipcode), selectivity estimates multiply incorrectly. `CREATE STATISTICS … (ndistinct, dependencies, mcv) ON (a, b) FROM t` captures cross-column distributions so the planner stops underestimating multi-predicate row counts."},{"term":"Generic vs custom plan (prepared statements)","definition":"Postgres can either replan each EXECUTE with the actual parameters (custom plan, accurate but expensive) or compute one plan ignoring values (generic plan, cached, may misestimate). After 5 executions it compares average costs and picks the cheaper strategy; force with `plan_cache_mode = force_generic_plan / force_custom_plan`."},{"term":"Row estimate under/over-estimation symptoms","definition":"Under-estimation (est 1, actual 1M) typically picks a nested loop that explodes into millions of inner lookups. Over-estimation (est 1M, actual 10) picks an expensive hash/merge build or seq scan over a cheap indexed nested loop. Both usually trace back to stale stats, correlated predicates, or LIMIT interacting with skew."}]},{"name":"Databases","cards":[{"term":"Repeatable Read isolation level","definition":"A transaction sees a stable snapshot of rows it has read — repeat reads return the same values. Prevents dirty and non-repeatable reads. Per the SQL standard it still allows phantom reads (new rows matching a range); Postgres's snapshot-based RR prevents those too."},{"term":"B+ tree index","definition":"Self-balancing tree where actual row pointers live only in leaf nodes, which are linked in a sorted doubly linked list. Internal nodes hold routing keys. O(log n) point lookup, cheap range scans by walking leaves. The default index structure in most relational DBs."},{"term":"Write-ahead log (WAL)","definition":"Durability mechanism: append changes to a log on disk before mutating the data pages. On crash, replay from the last checkpoint to recover. Turns random writes into sequential I/O and underpins atomicity, durability, and replication."},{"term":"MVCC (Multi-Version Concurrency Control)","definition":"Writers create new versions of rows instead of overwriting; each reader sees the version visible to its transaction's snapshot. Readers don't block writers and vice versa. Used by Postgres, Oracle, and MySQL InnoDB."},{"term":"xmin and xmax (Postgres tuple headers)","definition":"Every heap tuple stores xmin (XID that inserted it) and xmax (XID that deleted/updated it, or 0). A tuple is visible to a snapshot if xmin committed before the snapshot and xmax is either 0, aborted, or after the snapshot. This is how Postgres MVCC decides row visibility."},{"term":"HOT update (Heap-Only Tuple)","definition":"Postgres optimization where an UPDATE that changes no indexed columns and fits on the same page chains the new tuple to the old via a ctid pointer, skipping new index entries. Reduces index bloat and write amplification. Blocked if the page lacks free space (tune fillfactor)."},{"term":"Autovacuum","definition":"Background workers that run VACUUM and ANALYZE based on per-table thresholds (autovacuum_vacuum_scale_factor default 0.2, plus autovacuum_vacuum_threshold 50). Reclaims dead tuples for reuse (not disk) and updates planner stats. Tunable per-table via storage params."},{"term":"VACUUM FULL vs VACUUM","definition":"Plain VACUUM marks dead tuple space reusable in place; non-blocking. VACUUM FULL rewrites the whole table into a new file, returning space to the OS, but takes an ACCESS EXCLUSIVE lock and rewrites all indexes. Use pg_repack for online equivalents."},{"term":"Transaction ID wraparound","definition":"Postgres XIDs are 32-bit; only ~2 billion are \"in the past\" at any time. If autovacuum can't freeze old tuples (set xmin to FrozenXID) fast enough, the DB shuts down at 1M XIDs remaining to prevent data loss. Controlled by autovacuum_freeze_max_age (default 200M)."},{"term":"Postgres Serializable isolation (SSI)","definition":"Serializable Snapshot Isolation: runs transactions on snapshots like RR but tracks read/write dependencies via SIREAD predicate locks. If it detects a dangerous structure (rw-antidependency cycle), it aborts one transaction with serialization_failure (SQLSTATE 40001). No 2PL blocking."},{"term":"Read Committed (Postgres default)","definition":"Each statement gets its own snapshot taken at statement start, so two queries in one transaction can see different committed data. Prevents dirty reads but allows non-repeatable reads and phantoms. UPDATE/DELETE re-reads rows that changed under it (\"EvalPlanQual\")."},{"term":"Streaming replication (Postgres)","definition":"Physical replication: primary ships WAL records to standbys over a libpq connection; standbys replay them byte-for-byte. Standbys can serve reads if hot_standby=on. Lag measured via pg_stat_replication (write/flush/replay LSN). All-or-nothing — cluster-level, same major version."},{"term":"Logical replication (Postgres)","definition":"Decodes WAL into a logical change stream (INSERT/UPDATE/DELETE per row) via a publication on the source and subscription on the target. Per-table, allows cross-version and selective replication, supports DDL only manually. Requires wal_level=logical and a REPLICA IDENTITY."},{"term":"Replication slot (Postgres)","definition":"Server-side bookmark that prevents the primary from removing WAL still needed by a consumer (physical standby or logical subscriber). Persists across disconnects. Dangerous if abandoned: WAL accumulates until pg_wal fills the disk. Monitor via pg_replication_slots."},{"term":"synchronous_commit","definition":"Postgres setting controlling when COMMIT returns. on (default) waits for local WAL flush; remote_write/remote_apply wait for standby ack; off allows up to 3x wal_writer_delay of potential loss with no torn-commit risk. Tradeoff: durability vs latency."},{"term":"Point-in-time recovery (PITR)","definition":"Restore a base backup (pg_basebackup) then replay archived WAL up to a target time, LSN, or named restore point. Requires archive_mode=on and archive_command (or pg_receivewal). Set recovery_target_* in postgresql.conf; standby exits recovery when target is reached."},{"term":"JSONB vs JSON in Postgres","definition":"JSON stores the exact text as-given (preserves whitespace and key order, allows duplicate keys), reparsed on every access. JSONB stores a decomposed binary form: faster operations, supports indexing (GIN), but slightly slower to insert and doesn't preserve formatting."},{"term":"GIN index with jsonb_path_ops","definition":"Default jsonb_ops indexes every key and value separately; jsonb_path_ops hashes whole key/value paths, producing a smaller index that only supports @> (containment) but is faster and ~3x smaller. Cannot answer \"key exists\" (?) queries."},{"term":"Declarative partitioning (Postgres 10+)","definition":"CREATE TABLE ... PARTITION BY RANGE/LIST/HASH (col). Partitions are real tables attached as children; the planner does partition pruning (constraint exclusion at plan time, plus runtime pruning in 11+) to skip irrelevant partitions. Indexes must be defined on each partition."},{"term":"TOAST (The Oversized-Attribute Storage Technique)","definition":"When a row exceeds ~2KB, Postgres compresses oversized varlena columns and/or stores them out-of-line in a per-table toast relation (pg_toast.pg_toast_<oid>), chunked into ~2000-byte rows. Transparent to SQL. Strategies: PLAIN, EXTENDED (default), EXTERNAL, MAIN."},{"term":"pg_stat_statements","definition":"Extension that aggregates query execution stats (calls, total/mean time, rows, shared block hits/reads) by normalized query (constants stripped). Top tool for finding slow queries in production. Requires shared_preload_libraries and CREATE EXTENSION."},{"term":"BSON","definition":"Binary JSON: MongoDB's on-disk and wire format. Adds types JSON lacks — ObjectId, Date, Decimal128, Binary, int32/int64, Timestamp — plus length prefixes for fast skipping. Max document size 16 MB; use GridFS for larger blobs."},{"term":"ObjectId structure","definition":"12-byte default _id: 4-byte Unix timestamp (seconds), 5-byte random per-process value, 3-byte incrementing counter. Roughly sortable by creation time and extractable via getTimestamp(). Generated client-side by drivers, not the server."},{"term":"MongoDB oplog","definition":"Capped collection local.oplog.rs on the primary recording every write as an idempotent operation. Secondaries tail it and replay. Size defaults to 5% of free disk (min 990MB); sizing it determines how long a secondary can be offline before needing initial sync."},{"term":"Write concern w:majority","definition":"Mongo write returns success only after a majority of voting replica-set members have acknowledged. Combined with j:true also waits for journal flush. Required for causal consistency and majority read concern guarantees. w:1 acks after primary only — vulnerable to rollback on failover."},{"term":"Read preference modes","definition":"primary (default), primaryPreferred, secondary, secondaryPreferred, nearest. Drives which replica-set member serves reads. secondary reads can be stale (replication lag) and may read data later rolled back unless using readConcern majority. nearest picks by ping time."},{"term":"MongoDB elections","definition":"When a primary becomes unreachable, eligible secondaries (priority > 0) call an election using a Raft-like protocol (PV1). A node needs a majority of voting members to win. Arbiters vote but hold no data — useful for tie-breaking but reduce fault tolerance for w:majority."},{"term":"Sharded cluster components (MongoDB)","definition":"mongos: stateless query router clients connect to. Config servers (CSRS): a replica set holding cluster metadata and the chunk map. Shards: replica sets holding the actual data, each owning ranges/hashes of the shard key. Balancer (on config primary) moves chunks between shards."},{"term":"Chunk and jumbo chunk","definition":"Logical contiguous range of shard-key values, default size 128MB (configurable). The balancer migrates chunks to keep shards even. A jumbo chunk has grown too large to split (e.g., single-key value with too many docs) and can't be migrated — usually a bad shard-key choice."},{"term":"Hashed shard key","definition":"Mongo hashes the field value with MD5-derived hash to distribute writes evenly, breaking monotonic-key hotspots (e.g., ObjectId). Tradeoff: range queries on the field become scatter-gather across all shards. Compound hashed keys supported from 4.4."},{"term":"Multikey index","definition":"MongoDB index over an array field — creates one index entry per array element. Automatic when indexing an array. Compound multikey allowed but only one indexed field per document can be an array. Doesn't track which element matched, so $elemMatch may still re-scan documents."},{"term":"TTL index (MongoDB)","definition":"Single-field index on a Date field with expireAfterSeconds. A background thread (runs ~every 60s) deletes documents whose field is older than the TTL. Not precise to the second; can lag under load. Not allowed on _id or capped collections."},{"term":"$lookup","definition":"Aggregation stage performing a left outer join to another collection in the same database; matching docs are placed in an array field. Sharded foreign collections supported from 5.1. No real join optimizer — runs as a nested loop, so index the foreignField."},{"term":"MongoDB multi-document transactions","definition":"Available 4.0+ on replica sets, 4.2+ across shards. Run inside a session with startTransaction/commitTransaction; use snapshot read concern and majority write concern. Default 60s transactionLifetimeLimitSeconds. Use sparingly — each cross-shard commit is a 2PC."},{"term":"Change streams","definition":"Tail the oplog through a stable, resumable API (db.collection.watch()). Returns change events (insert/update/delete/replace/invalidate) with a resumeToken for restart. Requires majority read concern and a replica set. Used for CDC, materialized views, cache invalidation."},{"term":"WiredTiger","definition":"MongoDB's default storage engine since 3.2. Document-level concurrency via MVCC, journaling with a default 60s checkpoint interval, snappy compression on collections and prefix compression on indexes by default. Uses an in-memory cache (default 50% of RAM - 1GB, min 256MB)."},{"term":"Causal consistency in MongoDB","definition":"Client sessions guarantee read-your-writes, monotonic reads/writes, and writes-follow-reads across a single session by passing cluster time and operation time on each request. Requires majority read and write concerns to be fully durable. Per-session, not per-cluster."},{"term":"ACID vs BASE","definition":"ACID (Atomicity, Consistency, Isolation, Durability): transactional guarantees, typical of relational DBs. BASE (Basically Available, Soft state, Eventually consistent): tradeoff for availability/partition tolerance, typical of early NoSQL. Modern systems (Mongo, Cassandra LWT, Spanner) blur the line with tunable consistency."},{"term":"Phantom read","definition":"Anomaly where a range query returns a different set of rows when re-run in the same transaction because another transaction inserted/deleted rows matching the predicate. Prevented by Serializable (and by Postgres's snapshot-based Repeatable Read)."},{"term":"Document model vs relational — schema enforcement","definition":"Relational stores enforce schema at write time via DDL (NOT NULL, FK, CHECK), centralizing validation. Document stores defer it to the application or optional JSON Schema validators ($jsonSchema in Mongo). Tradeoff: faster evolution and embedded denormalization vs weaker cross-collection integrity (no FK enforcement in Mongo)."},{"term":"Embed vs reference (MongoDB modeling)","definition":"Embed when child data is bounded, owned by the parent, and read together (1:few). Reference (store an ObjectId, $lookup at query time) when the child is unbounded (1:many large), shared across parents (many:many), or updated independently. 16MB doc limit forces references for unbounded growth."}]},{"name":"Distributed Systems","cards":[{"term":"CAP theorem","definition":"In a distributed system that experiences a network Partition, you must choose between Consistency (every read returns the most recent write) and Availability (every request gets a non-error response). You cannot have all three at once during a partition."},{"term":"Linearizability","definition":"A consistency model where operations appear to take effect atomically at some instant between their invocation and completion, consistent with real-time ordering. Once a write is acknowledged, all subsequent reads see it or a later value. Strongest single-object consistency."},{"term":"Quorum (W + R > N)","definition":"With N replicas, requiring W acknowledgments per write and R per read such that W + R > N guarantees any read quorum overlaps with the latest write quorum, giving strong consistency without contacting every replica."},{"term":"Two-phase commit (2PC)","definition":"Atomic commit protocol. Phase 1 (PREPARE): coordinator asks all participants to durably log and vote yes/no. Phase 2 (COMMIT/ABORT): coordinator decides based on votes and tells everyone. Blocks if the coordinator crashes after PREPARE — participants stay holding locks."},{"term":"FLP impossibility","definition":"Fischer-Lynch-Paterson (1985): in an asynchronous network with even one crash-faulty process, no deterministic consensus protocol can guarantee both safety and liveness. Real systems escape it via partial synchrony assumptions, randomization, or failure detectors."},{"term":"Paxos (basic / single-decree)","definition":"Consensus for one value. Proposer picks a ballot number n, sends PREPARE(n); acceptors promise not to accept lower ballots and return any previously accepted value. Proposer then sends ACCEPT(n, v) using the highest-ballot prior value if any. Value is chosen when a majority accepts."},{"term":"Multi-Paxos","definition":"Optimization that elects a stable leader so it can skip the PREPARE phase for subsequent log slots, reducing each decision to one round trip. Reduces dueling-proposer livelock and is the basis for log replication in systems like Chubby and Spanner."},{"term":"Raft leader election","definition":"Followers start an election after a randomized election timeout (typically 150-300ms) by incrementing currentTerm and sending RequestVote RPCs. A candidate wins on a majority of votes in that term; voters grant at most one vote per term and only to candidates with an up-to-date log."},{"term":"Raft log matching property","definition":"If two logs contain an entry with the same index and term, then (a) they store the same command and (b) all preceding entries are identical. Enforced by AppendEntries carrying prevLogIndex/prevLogTerm; a follower rejects if its log doesn't match, forcing the leader to back up and overwrite."},{"term":"Raft safety (Leader Completeness)","definition":"Any log entry committed in a given term is present in the logs of all leaders of higher terms. Ensured by the voting rule: a server only votes for a candidate whose log is at least as up-to-date (higher last term, or same term and longer) as its own."},{"term":"Raft joint consensus","definition":"Two-phase membership change to avoid split-brain across configurations. Cluster transitions through C_old,new which requires majorities in both old and new configurations to commit anything, then commits the final C_new. Prevents two disjoint majorities from electing conflicting leaders."},{"term":"Why consensus needs a stable leader","definition":"Without a unique leader, concurrent proposers can repeatedly preempt each other's ballots (dueling proposers in Paxos), preventing progress. A stable leader serializes proposals, enables batching/pipelining, and lets followers skip the prepare phase — turning each decision into one round trip."},{"term":"Lamport timestamps","definition":"Each process keeps a counter; increments on local events, attaches it to messages, and on receive sets counter = max(local, received) + 1. Produces a total order consistent with happens-before but cannot detect concurrency — a < b does not imply causality."},{"term":"Vector clocks","definition":"Each of N processes maintains an N-entry vector; increments its own slot on events and element-wise maxes on receive. V1 < V2 iff every entry <= and at least one is strictly less; otherwise concurrent. Precisely captures happens-before but costs O(N) per message."},{"term":"Hybrid logical clock (HLC)","definition":"Combines physical wall-clock time with a logical counter into a single 64-bit timestamp. Stays within a small bound of physical time while preserving happens-before like a Lamport clock — used by CockroachDB and MongoDB for causal ordering without TrueTime hardware."},{"term":"Spanner TrueTime","definition":"Google API exposing time as an interval [earliest, latest] with bounded uncertainty (epsilon, typically a few ms) backed by GPS and atomic clocks. Spanner commits wait out epsilon (\"commit wait\") so that timestamps respect real-time order, enabling external consistency globally."},{"term":"Happens-before relation","definition":"Lamport's partial order: a -> b if a and b are in the same process with a first, or a is a send and b is the matching receive, or transitively. Events unrelated by -> are concurrent. Foundation for causal consistency and vector clocks."},{"term":"Causal consistency","definition":"Operations causally related (by happens-before) are seen in the same order by all processes; concurrent operations may be seen in any order. Strictly weaker than sequential but strong enough to preserve \"reply after post\" semantics. Implementable with vector clocks or dependency tracking."},{"term":"Read-your-writes consistency","definition":"A session guarantee: after a client writes a value, all of its subsequent reads return that value or a later one — never a stale value predating its own write. Typically enforced by sticky sessions or by clients tracking the latest write's version/timestamp."},{"term":"Monotonic reads","definition":"Session guarantee that successive reads by the same client never go backwards in time: once a client sees value v, later reads return v or newer. Violated when a client's reads bounce between replicas at different replication lags."},{"term":"Monotonic writes","definition":"Session guarantee that writes from a single client are applied in the order issued. Without it, w1 then w2 from the same client may be observed as w2 then w1 by other replicas (e.g., in async multi-leader replication)."},{"term":"PRAM (pipelined RAM) consistency","definition":"Writes by the same process are seen in order by every other process, but writes from different processes may be observed in different orders by different observers. Equivalent to read-your-writes + monotonic reads + monotonic writes; weaker than causal."},{"term":"Sequential consistency","definition":"All operations appear to execute in some total order, and each process's operations appear in that order in the sequence it issued them. Unlike linearizability, this order need not match real time — a write can be ordered before an earlier one from a different process."},{"term":"Strong eventual consistency (SEC)","definition":"Eventual consistency plus a deterministic merge: any two replicas that have received the same set of updates are in the same state, regardless of order or duplicates. Achieved by CRDTs without coordination or consensus."},{"term":"Leader/follower replication (sync vs async)","definition":"Synchronous: leader waits for at least one follower ack before acknowledging the client — durable but adds latency and stalls if the follower is slow. Asynchronous: leader acks immediately and ships entries in the background — fast, but a leader crash can lose committed-from-client writes. Semi-sync waits for any one follower."},{"term":"Multi-leader replication","definition":"Multiple nodes accept writes and replicate to each other. Improves write availability and geo-locality but introduces write-write conflicts that need resolution (LWW, CRDTs, or application logic). Used for multi-datacenter, collaborative editing, offline clients."},{"term":"Leaderless (Dynamo-style) replication","definition":"Any replica can accept writes; clients send to N replicas and wait for W acks, read from R. Uses quorums, read repair, hinted handoff, and anti-entropy to converge. No leader means no failover delay, but no linearizability without extra mechanisms."},{"term":"Read repair","definition":"During a quorum read, the client (or coordinator) detects stale replicas by comparing versions/timestamps and asynchronously writes the latest value back to the laggers. Provides anti-entropy on the read path — cheap for hot data, useless for cold data."},{"term":"Anti-entropy (Merkle tree sync)","definition":"Background process that compares replica state to repair divergence. Dynamo-style systems use Merkle trees over key ranges: replicas exchange root hashes, descend only into subtrees that differ, and reconcile the differing keys. Fixes data that read repair never touches."},{"term":"Hinted handoff","definition":"When a target replica is down during a write, a peer accepts the write on its behalf and stores a \"hint\" — later, when the target recovers, the hint is replayed to it. Preserves write availability in sloppy quorums at the cost of temporary inconsistency."},{"term":"Sloppy quorum","definition":"If the preferred N replicas for a key aren't reachable, the system writes to N other (non-canonical) live nodes to maintain availability. Combined with hinted handoff for eventual delivery. Trades strict W+R>N guarantees for availability under partitions."},{"term":"Last-writer-wins (LWW)","definition":"Conflict resolution that picks the value with the highest timestamp and discards others. Simple and convergent, but silently drops concurrent writes and is sensitive to clock skew — two writes within the skew window can be reordered arbitrarily."},{"term":"Split brain","definition":"Failure mode where a network partition leaves two subsets of nodes each believing they are the active leader/primary, both accepting writes. Resolved by quorum-based election (majority cannot exist on both sides) plus fencing tokens to invalidate stale leaders."},{"term":"Gray failure","definition":"A node is partially or intermittently broken — slow disk, packet loss, GC pauses — but passes basic health checks. Worse than a clean crash because the system keeps routing work to it. Detected via tail-latency probes, peer reports, and adaptive timeouts."},{"term":"Byzantine vs crash-stop failure","definition":"Crash-stop: faulty nodes halt and stop responding (the model assumed by Paxos/Raft). Byzantine: faulty nodes can send arbitrary, even malicious, messages. Tolerating f Byzantine faults requires 3f+1 nodes (PBFT) versus 2f+1 for crash faults."},{"term":"Phi-accrual failure detector","definition":"Instead of a binary up/down, computes a continuous suspicion value phi = -log10(P(no heartbeat by now)) from the distribution of past heartbeat intervals. Apps choose a phi threshold per use case. Used in Cassandra and Akka — adapts to variable network conditions."},{"term":"SWIM failure detection","definition":"Scalable Weakly-consistent Infection-style Membership. Each node periodically pings a random peer; on timeout, asks k other peers to indirectly ping it before declaring it suspect. Membership/suspicion updates piggyback on pings via gossip. O(1) load per node; used by Serf, HashiCorp Consul, Memberlist."},{"term":"Gossip protocol","definition":"Each node periodically exchanges state with a few random peers; information spreads epidemically in O(log N) rounds. Scales to thousands of nodes with bounded per-node load. Used for membership, failure detection, anti-entropy (Cassandra, Dynamo, Consul)."},{"term":"Lease","definition":"A time-bounded grant of exclusive rights (e.g., to be leader, hold a lock, cache a value) that automatically expires unless renewed. Lets a system make safe decisions without contacting the holder, as long as clocks aren't too skewed — the lease must be shorter than the safe clock-drift bound."},{"term":"Fencing token","definition":"Monotonically increasing number issued with each lock/lease acquisition. Resource servers reject requests with a token lower than the highest seen, preventing a paused/old client from corrupting state after its lease expired. Required for any correct distributed lock."},{"term":"Why naive distributed locks are unsafe","definition":"A client can acquire a lock, then pause (GC, page fault, network delay) past the lease expiry; another client acquires it; the first wakes and writes, violating mutual exclusion. Time-based leases alone are insufficient — the protected resource must check a monotonic fencing token."},{"term":"Saga pattern","definition":"Long-running business transaction modeled as a sequence of local transactions, each with a compensating action that semantically undoes it. On failure, executed steps are rolled back by running their compensations in reverse. No global locks — at the cost of no isolation (intermediate states are visible)."},{"term":"TCC (Try/Confirm/Cancel)","definition":"Application-level two-phase commit. Try: reserve resources (e.g., hold inventory). Confirm: commit the reservation. Cancel: release it. Unlike 2PC, no XA/database locks are held between phases — reservations are application state, so timeouts and recovery are explicit."},{"term":"Three-phase commit (3PC)","definition":"Adds a PRE-COMMIT phase between PREPARE and COMMIT to avoid 2PC's blocking on coordinator failure. In theory non-blocking under crash-stop with synchronous network, but unsafe under network partitions (can produce inconsistent decisions), so rarely used in practice."},{"term":"Percolator-style transactions","definition":"Google Percolator's distributed-transaction protocol over BigTable: snapshot-isolated multi-row transactions using a primary lock row plus per-row locks, a timestamp oracle, and 2PC. Commit succeeds iff the primary lock is replaced by a write record. Inspired TiDB and CockroachDB."},{"term":"Exactly-once delivery","definition":"Strictly impossible over an unreliable network — you can't distinguish \"message lost\" from \"ack lost\". Achieved end-to-end via at-least-once delivery plus idempotent processing or deduplication (e.g., per-message ID with a dedupe store), often called effectively-once."},{"term":"At-least-once vs at-most-once delivery","definition":"At-least-once: retry until acked; may deliver duplicates — requires idempotent consumers. At-most-once: send without retry; may lose messages but never duplicates. The right choice depends on whether duplicate or loss is worse for the application."},{"term":"Idempotency key","definition":"Client-supplied unique ID attached to a request; the server records the result keyed by it and returns the cached result on retries. Standard pattern for safe retries of non-idempotent operations (payments, account creation) over at-least-once transports."},{"term":"G-Counter CRDT","definition":"Grow-only counter. Each of N replicas owns a slot in an N-entry vector and only increments its own slot; the counter value is the sum of all slots, merge is element-wise max. Monotonic and commutative — converges without coordination. Cannot decrement."},{"term":"PN-Counter CRDT","definition":"Counter supporting increment and decrement, implemented as two G-Counters P and N; value is sum(P) - sum(N). Merge is element-wise max of both vectors. Used for likes/votes where users can undo."},{"term":"OR-Set (Observed-Remove Set) CRDT","definition":"Set CRDT where each add tags the element with a unique token; remove only removes tokens observed at the time of removal. An element exists if any add-token has not been removed. Resolves add/remove race by keeping concurrent adds — \"add wins\" against a stale remove."},{"term":"LWW-Register CRDT","definition":"Register holding a single value with an associated timestamp; merge keeps the value with the larger timestamp (ties broken by replica ID). Convergent and simple, but loses concurrent updates and is vulnerable to clock skew — same caveats as LWW conflict resolution."}]},{"name":"Flink","cards":[{"term":"Flink's streaming model vs Spark's","definition":"Flink is a true record-at-a-time streaming engine where batch is treated as a bounded stream (same runtime, same operators). Spark Structured Streaming is micro-batch by default (continuous mode is experimental), so Flink generally achieves lower per-event latency and more natural event-time semantics."},{"term":"JobManager","definition":"Flink's coordinator process. Hosts the Dispatcher, ResourceManager, and a per-job JobMaster that builds the ExecutionGraph, schedules tasks to TaskManager slots, coordinates checkpoints via the CheckpointCoordinator, and triggers recovery. HA setups run multiple JobManagers with ZooKeeper or Kubernetes-based leader election."},{"term":"TaskManager","definition":"Flink worker process (JVM) that executes operator subtasks. Exposes a fixed number of task slots, manages network buffers and managed memory, and runs the actual user code. State backends and local RocksDB instances live inside the TaskManager."},{"term":"Task slot","definition":"Unit of resource isolation inside a TaskManager — each slot gets an equal share of managed memory (but CPU is not isolated). A job's total parallelism cannot exceed the sum of slots across TaskManagers. One slot can run one parallel pipeline of operators via slot sharing."},{"term":"Slot sharing","definition":"By default, subtasks from different operators of the same job can share a single slot as long as they're in the same SlotSharingGroup. This lets a whole pipeline (source → map → sink) run in one slot, so cluster size scales with the highest-parallelism operator rather than the sum."},{"term":"StreamGraph → JobGraph → ExecutionGraph","definition":"Flink's three IR layers. StreamGraph: logical DAG from the user's DataStream API calls. JobGraph: client-side optimized graph with operator chaining applied, submitted to the JobManager. ExecutionGraph: the JobManager's parallel, runtime view with one ExecutionVertex per subtask and IntermediateResultPartitions for edges."},{"term":"Operator chaining","definition":"Compile-time optimization that fuses consecutive one-to-one (forward) operators with the same parallelism into a single task running in one thread, eliminating serialization and network hops between them. Disabled by startNewChain(), disableChaining(), or shuffles like keyBy."},{"term":"DataStream API vs Table API/SQL","definition":"DataStream is the mid-level imperative API (map, keyBy, process, windows) with full control over state and timers. Table API / Flink SQL is declarative, unifies batch and stream over the same engine, and lets the Blink planner optimize joins, aggregates, and watermark propagation. SQL compiles down to DataStream operators."},{"term":"Keyed state","definition":"State scoped to a key extracted by keyBy — the runtime guarantees that for a given key, all events and all state access happen on a single subtask. Available primitives: ValueState, ListState, MapState, ReducingState, AggregatingState. Only accessible inside keyed operators (KeyedProcessFunction, etc.)."},{"term":"Operator state","definition":"State scoped to a parallel operator instance (not a key), typically used by sources and sinks to remember things like Kafka offsets or pending transactions. Redistributed on rescaling via ListState (even-split) or UnionListState (broadcast-all-to-all); also includes BroadcastState."},{"term":"HashMapStateBackend","definition":"State backend that keeps working state as Java objects on the JVM heap and writes full snapshots to the configured checkpoint storage (e.g., S3) on each checkpoint. Fast access, bounded by heap size, no incremental checkpoints. Replaced the old FsStateBackend in Flink 1.13."},{"term":"EmbeddedRocksDBStateBackend","definition":"Stores working state in an on-disk RocksDB instance per TaskManager, serializing values on every access. Supports state much larger than memory and incremental checkpoints (uploads only changed SST files since the last checkpoint). Slower per-access than heap, but the production choice for large keyed state."},{"term":"MemoryStateBackend status","definition":"Deprecated in Flink 1.13 and removed in later releases. It held both working state and checkpoints in JobManager memory, which was unsafe for anything beyond local testing. Replaced by HashMapStateBackend + JobManagerCheckpointStorage for the equivalent test setup."},{"term":"Checkpoint barrier","definition":"A special marker record injected into the stream by sources at the JobManager's request. Barriers flow through the dataflow with normal records; when an operator has received the barrier for checkpoint N from all input channels, it snapshots its state and forwards the barrier downstream. This is Flink's variant of the Chandy-Lamport asynchronous snapshot."},{"term":"Aligned checkpoint","definition":"Default mode: when an operator receives a barrier on one input channel, it buffers further records from that channel until barriers arrive on all other channels, then snapshots. Under backpressure the alignment can take seconds-to-minutes and stall the pipeline, but no in-flight data is persisted."},{"term":"Unaligned checkpoint","definition":"Mode (since 1.11) where an operator snapshots immediately on receiving the first barrier and writes all in-flight buffered records (between channels) into the checkpoint along with its state. Bounds checkpoint duration under backpressure at the cost of larger checkpoint size. Enabled via execution.checkpointing.unaligned."},{"term":"Checkpoint storage","definition":"Where state snapshots are persisted. JobManagerCheckpointStorage keeps them in JM memory (test only); FileSystemCheckpointStorage writes state files to a durable filesystem URI (s3://, hdfs://, gs://, file://) while the JobManager keeps the checkpoint metadata pointer. Configured via state.checkpoints.dir."},{"term":"Savepoint vs checkpoint","definition":"Both are consistent snapshots using the same mechanism, but checkpoints are framework-owned, tuned for fast incremental writes, and auto-deleted when superseded. Savepoints are user-triggered, in a stable canonical format, version- and topology-compatible, and used for planned upgrades, rescaling, and code changes via \"stop with savepoint\"."},{"term":"Exactly-once end-to-end in Flink","definition":"Flink guarantees exactly-once state internally via aligned checkpoints. End-to-end exactly-once additionally requires a transactional sink implementing TwoPhaseCommitSinkFunction: pre-commit happens at the checkpoint barrier, and the JobManager's \"checkpoint complete\" notification triggers the second-phase commit (e.g., Kafka transaction commit)."},{"term":"Event time","definition":"Timestamp embedded in the event itself (when it occurred at the source). Produces deterministic, reprocessable results independent of arrival order or processing delays — the same input always yields the same windowed output. Requires watermarks to know when to fire windows."},{"term":"Processing time","definition":"Wall-clock time on the TaskManager when the event is processed. Cheapest and lowest-latency (no watermarks needed) but non-deterministic — reruns produce different windows, and event ordering across the cluster is meaningless. Fine for low-latency triggers without correctness guarantees."},{"term":"Ingestion time","definition":"Timestamp assigned by the source operator when the event enters Flink. Better than processing time because it's stable through the pipeline, but still doesn't reflect when the event actually happened, so it can't correct for source-side delays."},{"term":"Watermark","definition":"A monotonically non-decreasing timestamp T flowing in-band with the stream that asserts \"no future event with timestamp < T is expected from this source\". Event-time windows fire when the watermark passes their end. An operator's watermark is the minimum of incoming-channel watermarks."},{"term":"BoundedOutOfOrdernessWatermarks","definition":"Standard watermark strategy: emits watermark = max_event_timestamp_seen - configured_delay (e.g., Duration.ofSeconds(10)). Trades latency (longer delay) for tolerance to out-of-order events. Configured via WatermarkStrategy.forBoundedOutOfOrderness()."},{"term":"Allowed lateness","definition":"Per-window setting that keeps the window's state alive for a configured duration after the watermark passes its end. Late events arriving within that window re-fire the window (incremental update). Events later than that are dropped or routed to a side output via sideOutputLateData()."},{"term":"Tumbling vs sliding vs session windows","definition":"Tumbling: fixed-size, non-overlapping (e.g., 1-minute buckets). Sliding: fixed size with a slide interval, so events fall in multiple windows (e.g., size 1m, slide 10s). Session: gap-based — a window stays open until an inactivity gap, so per-key sessions vary in length. Global: all elements in one window, requires a custom trigger."},{"term":"ReduceFunction vs AggregateFunction vs ProcessWindowFunction","definition":"ReduceFunction: incremental, input and output types must match. AggregateFunction: incremental with separate accumulator, input, and output types (most general incremental form). ProcessWindowFunction: holistic — buffers all elements until the window fires, giving access to window metadata; often combined with an incremental aggregator to get both."},{"term":"keyBy mechanics","definition":"Logical hash partitioning: KeySelector extracts a key, Flink hashes it with MurmurHash, then maps to a key group (default 128 max parallelism), and each key group is assigned to one subtask. Key groups are the unit of state rescaling — changing parallelism redistributes groups, not individual keys."},{"term":"Interval join","definition":"Keyed event-time join where each left event e1 is matched with right events e2 such that e1.ts + lowerBound <= e2.ts <= e1.ts + upperBound. Implemented in KeyedStream.intervalJoin() with buffered state on both sides bounded by the interval; cleaned up as watermarks advance."},{"term":"Temporal table join","definition":"SQL/Table API join against a versioned table (e.g., FX rates) where each probe row joins the version of the dimension valid at the probe's event time. Syntax: FOR SYSTEM_TIME AS OF o.event_time. Avoids the staleness issue of plain lookup joins for historical correctness."},{"term":"Async I/O","definition":"AsyncDataStream.unorderedWait / orderedWait operator for issuing non-blocking calls to external systems (DBs, REST). Maintains a bounded number of in-flight requests with a timeout. Ordered mode preserves stream order at the cost of head-of-line blocking; unordered lets responses overtake. Checkpoints include the in-flight request queue."},{"term":"Broadcast state","definition":"Pattern where one stream (rules, configs, feature flags) is broadcast to all parallel instances of a downstream operator and stored in MapState replicated across subtasks. The other (keyed) stream consults this state via BroadcastProcessFunction. Useful for dynamic rule engines."},{"term":"Side output","definition":"Additional typed output stream from a ProcessFunction obtained via ctx.output(outputTag, value), then DataStream.getSideOutput(tag). Used for late events, dead-letter routing, and splitting a stream into multiple typed outputs without re-keying or re-serializing."},{"term":"ProcessFunction","definition":"Lowest-level streaming primitive that exposes (event, context, collector). On a KeyedStream it's KeyedProcessFunction, which adds keyed state access and the TimerService for registering event-time / processing-time timers. The building block under windows, joins, and CEP."},{"term":"Flink timers","definition":"Per-key timers registered via ctx.timerService().registerEventTimeTimer(ts) or registerProcessingTimeTimer(ts). Event-time timers fire when the watermark passes ts; processing-time timers fire on wall clock. onTimer() callback gets the timestamp and the same keyed state. Timers are checkpointed."},{"term":"Backpressure in Flink","definition":"Implemented via credit-based flow control on network buffers — a downstream subtask only grants credits (buffer slots) it has free, so a slow consumer naturally stalls the upstream producer. Visible in the Flink UI's Backpressure tab as OK / LOW / HIGH per task, derived from sampling output buffer pool usage."},{"term":"Restart strategies","definition":"Configured via restart-strategy. Options: fixed-delay (N attempts with delay D), exponential-delay (backoff with jitter, since 1.13), failure-rate (max failures per interval before giving up), and none / no-restart. With checkpointing enabled, default is fixed-delay = Integer.MAX_VALUE attempts."},{"term":"Recovery from checkpoint","definition":"On failure, the JobManager cancels remaining tasks, restarts the full ExecutionGraph (or affected region with region failover), and restores each subtask's state from the last completed checkpoint. Sources rewind to checkpointed positions (e.g., Kafka offsets), so all data since that checkpoint is reprocessed."},{"term":"Kafka source offset commit semantics","definition":"The KafkaSource stores offsets in its own checkpointed operator state; it only commits offsets back to Kafka on checkpoint completion (and purely for monitoring). On recovery, Flink reads from the checkpointed offsets, not from Kafka's __consumer_offsets — this is what makes Flink + Kafka exactly-once independent of Kafka's consumer group state."},{"term":"Flink vs Kafka Streams","definition":"Kafka Streams is a JVM library embedded in your service — no cluster, scales by running more service instances, state in RocksDB + changelog topics, limited to Kafka in/out. Flink is a separate cluster runtime with richer windowing, event-time, multi-source support, async I/O, and SQL, at the cost of operational overhead."},{"term":"Flink vs Spark Structured Streaming","definition":"Spark Structured Streaming is micro-batch by default (configurable trigger interval), built on the Spark DAG scheduler, with strong batch and ML ecosystem ties. Flink is true streaming with lower tail latency, more mature event-time/watermark semantics, and richer per-key timers/state. Spark wins on unified batch+ML; Flink wins on low-latency stateful streaming."},{"term":"Flink vs Apache Beam","definition":"Beam is a portable API/SDK (Pipelines, PCollections, DoFns) that doesn't execute anything itself — it compiles to a runner. Flink is one of the most feature-complete Beam runners (alongside Dataflow). Writing in Beam buys portability across runners; writing directly in the DataStream API gives access to Flink-specific features sooner."},{"term":"Max parallelism and key groups","definition":"maxParallelism (default 128, configurable up to 32768) sets the number of key groups, which is fixed at job start and cannot be changed without a savepoint + reset. Parallelism can be changed up to maxParallelism via rescaling; key groups are the atomic unit redistributed between subtasks on rescale."}]},{"name":"Inter-service communication","cards":[{"term":"When to pick gRPC over REST/JSON","definition":"Choose gRPC for internal service-to-service RPC where you control both ends and want a strict schema, smaller payloads, streaming, and low latency over HTTP/2 multiplexing. Stick with REST/JSON when you need browser clients, public APIs, easy curl/debuggability, or polyglot clients without codegen."},{"term":"HTTP/2 features gRPC depends on","definition":"gRPC requires HTTP/2 for binary framing, header compression (HPACK), and multiplexed bidirectional streams over a single TCP connection. Each RPC is one HTTP/2 stream, which is why gRPC can do client/server/bidi streaming without head-of-line blocking at the application layer."},{"term":"gRPC four streaming modes","definition":"Unary (1 request, 1 response), server-streaming (1 request, stream of responses), client-streaming (stream of requests, 1 response), and bidirectional streaming (independent request and response streams on the same HTTP/2 stream)."},{"term":"gRPC deadline vs timeout","definition":"A deadline is an absolute wall-clock point (\"respond by T\") propagated through metadata (grpc-timeout header) so every downstream hop shares the same budget. A timeout is a relative duration that each hop applies locally; deadlines are preferred because they prevent budget explosion across fan-out calls."},{"term":"gRPC status codes","definition":"A fixed enum returned in the grpc-status trailer (0=OK, 3=INVALID_ARGUMENT, 4=DEADLINE_EXCEEDED, 5=NOT_FOUND, 7=PERMISSION_DENIED, 8=RESOURCE_EXHAUSTED, 13=INTERNAL, 14=UNAVAILABLE, 16=UNAUTHENTICATED). UNAVAILABLE is the canonical \"safe to retry\" signal."},{"term":"Protobuf varint (LEB128) encoding","definition":"Each byte uses 7 bits for value and the high bit as a continuation flag; small numbers take one byte, large ones up to 10. It is little-endian groups of 7 bits, so 300 encodes as 0xAC 0x02 (10101100 00000010 -> 0000010 0101100 = 300)."},{"term":"Protobuf ZigZag encoding","definition":"Used by sint32/sint64 to map signed integers to unsigned for efficient varint storage: n -> (n << 1) ^ (n >> 31). Without it, negative numbers sign-extend to 10 varint bytes; with it, -1 becomes 1, 1 becomes 2, -2 becomes 3, etc."},{"term":"Protobuf field tag byte layout","definition":"Each field is prefixed by a varint key built as (field_number << 3) | wire_type. The low 3 bits give the wire type (0=varint, 1=64-bit fixed, 2=length-delimited, 5=32-bit fixed; 3/4=deprecated groups), and the rest is the field number."},{"term":"When fixed32/fixed64 beats varint","definition":"Use fixed32/fixed64 when values are usually large (e.g. hashes, IDs near 2^32) because varint costs 5+ bytes for big ints while fixed is always 4 or 8. For small/positive numbers, varint wins."},{"term":"Why never reuse a protobuf field number","definition":"Old clients with the prior schema will parse the new field as the old type, silently corrupting data because wire format only carries field number + wire type, not field name. Use the `reserved` keyword to block the number and name after removal."},{"term":"proto3 required vs optional","definition":"proto3 removed `required` (it broke evolution: you can never safely remove a required field). All fields default to \"implicitly optional\" with zero defaults and no presence tracking; the `optional` keyword was re-added in 3.15 to opt back into explicit has_field() presence."},{"term":"Protobuf oneof","definition":"A union where at most one field in the group is set; setting another field clears the previous. On the wire it is just normal fields with their own numbers, but generated code enforces mutual exclusion and exposes a which-case discriminator."},{"term":"google.protobuf.FieldMask","definition":"A list of field paths (e.g. \"user.name\", \"user.address.city\") used to specify partial reads/updates of a message, analogous to GraphQL field selection or PATCH semantics. Standard way to do sparse updates in gRPC APIs."},{"term":"gRPC interceptors","definition":"Middleware that wraps RPC calls on client or server (unary and stream variants) for cross-cutting concerns: auth, logging, tracing, metrics, retries. Chained around the handler much like HTTP middleware."},{"term":"gRPC client-side load balancing modes","definition":"pick_first (use the first resolved address, fail over only on error), round_robin (rotate across all addresses from name resolution), and xDS (dynamic config from a control plane like Envoy/Istio for weighted/locality-aware balancing). Picked via service config."},{"term":"gRPC retry and hedging","definition":"Configured via the service config: retryPolicy (exponential backoff on listed status codes, typically UNAVAILABLE) or hedgingPolicy (send N parallel attempts after a delay, take first success). Both require the call to be idempotent."},{"term":"grpc-web","definition":"Browser-compatible gRPC variant that uses HTTP/1.1 or HTTP/2 with a special framing because browsers cannot use raw HTTP/2 trailers. Requires a proxy (Envoy filter or grpcwebproxy) to translate between grpc-web frames and standard gRPC."},{"term":"Idempotency key pattern","definition":"Client generates a UUID and sends it with the request (e.g. Idempotency-Key header); server stores key -> response for a TTL and returns the stored response on retry. Lets clients safely retry non-idempotent operations like payments without double-charging."},{"term":"Circuit breaker states","definition":"Closed (requests flow, failures counted), Open (fail fast for a cool-off period without calling downstream), Half-Open (allow a probe request; if it succeeds close, else re-open). Trips on error-rate or consecutive-failure thresholds."},{"term":"Bulkhead pattern","definition":"Isolate resources (thread pools, connection pools, semaphores) per downstream dependency so a slowdown in one service cannot exhaust all threads and take down the caller. Named after ship compartments that prevent a single hull breach from sinking the vessel."},{"term":"Backpressure in streaming RPCs","definition":"gRPC inherits HTTP/2 flow control: the receiver advertises a window and the sender blocks when the window is exhausted, naturally pushing back on producers. At app level, expose this by not reading from the stream faster than you can process."},{"term":"Sync RPC vs async messaging tradeoffs","definition":"RPC gives low latency and immediate error signals but tightly couples availability (caller fails if callee is down) and capacity. Messaging decouples producer/consumer in time and load (queue buffers), but adds end-to-end latency, ordering complexity, and eventual-consistency reasoning."},{"term":"Request-reply over a message queue","definition":"Producer sends a request with a correlation_id and reply-to address; consumer processes and publishes the response to that address, which the producer is listening on. Lets you do RPC semantics over async transports."},{"term":"SQS standard vs FIFO","definition":"Standard queues are unlimited-TPS, at-least-once, best-effort ordering. FIFO queues guarantee strict ordering within a MessageGroupId and exactly-once delivery via a 5-minute MessageDeduplicationId window, but cap at 300 TPS (3000 with batching) per queue."},{"term":"SQS visibility timeout","definition":"When a consumer receives a message it becomes invisible to others for VisibilityTimeout seconds (default 30s, max 12h); if not deleted within that window it reappears for redelivery. Consumers extend via ChangeMessageVisibility for long processing."},{"term":"SQS long polling","definition":"ReceiveMessage with WaitTimeSeconds up to 20 holds the connection open until a message arrives or the timeout expires, reducing empty responses and API cost vs short polling. Effectively the only sane default for production consumers."},{"term":"SQS DLQ and redrive policy","definition":"A RedrivePolicy on the source queue specifies a deadLetterTargetArn and maxReceiveCount; once a message has been received that many times without being deleted, SQS moves it to the DLQ for out-of-band inspection. Prevents poison messages from blocking the queue."},{"term":"SNS fanout","definition":"Publish once to an SNS topic, deliver to many subscribers (SQS queues, Lambda, HTTP, email, SMS). Combined with SQS subscriptions it's the canonical AWS pub/sub fanout for decoupling producers from N consumers."},{"term":"SNS message filtering","definition":"Each subscription can attach a FilterPolicy (JSON predicate over message attributes or body) so SNS only delivers matching messages, avoiding consumer-side filtering. Supports exact match, anything-but, numeric ranges, prefix, and exists checks."},{"term":"Kafka vs SQS offset model","definition":"SQS is a queue: the broker tracks per-message state (in-flight, deleted), and messages disappear after consumption. Kafka is a partitioned log: the broker just stores messages with offsets and consumers track their own position, enabling replay and multiple independent consumer groups over the same data."},{"term":"RabbitMQ exchange types","definition":"direct (route by exact routing key match to bound queues), topic (wildcard pattern match like \"orders.*.eu\"), fanout (broadcast to all bound queues, ignore key), and headers (match on header attributes instead of routing key). RabbitMQ is AMQP-based with broker-side routing, contrasting with Kafka's dumb-broker/smart-consumer model."},{"term":"GCP Pub/Sub push vs pull","definition":"Pull: subscriber calls Pull/StreamingPull and acks within ackDeadline (10s default, extendable to 10min). Push: Pub/Sub POSTs to a subscriber HTTPS endpoint and treats 2xx as ack; push auto-scales but you give up flow control."},{"term":"Transactional outbox pattern","definition":"Within the same DB transaction that mutates business state, insert a row into an \"outbox\" table; a separate relay process polls or tails the log (CDC) and publishes those rows to the message broker. Solves the dual-write problem of \"commit DB then publish event\" atomically."},{"term":"Saga orchestration vs choreography","definition":"Orchestration: a central coordinator service issues commands to participants and tracks state (easier to reason about, single point of logic). Choreography: each service reacts to events and emits its own (no central coupling, but flow is implicit and harder to debug at scale)."},{"term":"Idempotent consumer","definition":"A consumer that can process the same message multiple times safely, typically by recording processed message IDs in a dedup store keyed by (producer_id, message_id) and short-circuiting duplicates. Required because most brokers (SQS standard, Kafka, Pub/Sub pull) are at-least-once."},{"term":"Confluent Schema Registry","definition":"Central HTTP service that stores Avro/Protobuf/JSON schemas keyed by subject and version; producers register schemas and embed a schema ID in each message, consumers fetch by ID. Enforces configurable compatibility (BACKWARD, FORWARD, FULL) at registration time."},{"term":"Backward vs forward schema compatibility","definition":"Backward compatible: new schema can read data written with old schema (safe to upgrade consumers first). Forward compatible: old schema can read data written with new schema (safe to upgrade producers first). FULL = both."},{"term":"Safe additive changes in gRPC/protobuf APIs","definition":"Add new fields with new numbers (unknown fields are preserved and round-trip), add new RPC methods, add new enum values (but readers must tolerate unknown enums). Never change a field's type or number, never repurpose a number, never remove a field without reserving it."},{"term":"Service mesh sidecar responsibilities","definition":"An Envoy-class proxy injected next to each service handles mTLS termination, retries, timeouts, circuit breaking, traffic splitting, and telemetry, so apps speak plain HTTP/gRPC to localhost. Control plane (Istio, Linkerd, Consul) pushes config via xDS."},{"term":"mTLS at the mesh layer","definition":"Sidecars terminate and originate TLS with workload identities (e.g. SPIFFE SVIDs) issued by the mesh CA; the application traffic stays plaintext on loopback. Gives zero-trust mutual auth without each service implementing TLS or cert rotation."}]},{"name":"Kafka & Pub/Sub","cards":[{"term":"Kafka partition","definition":"The unit of parallelism and ordering in Kafka. A topic is split into N partitions, each an append-only log replicated across brokers. Ordering is guaranteed within a partition but never across partitions. Throughput scales by adding partitions, but per-partition consumer concurrency is capped at one consumer per group."},{"term":"Kafka segment","definition":"A partition's log is physically stored as a sequence of segment files on disk (e.g. 00000000000000000000.log) plus .index and .timeindex sidecars. Only the active segment is written to; older segments are immutable and are the unit of retention, deletion, and compaction."},{"term":"acks=all (acks=-1)","definition":"Producer setting requiring the leader to wait for all in-sync replicas to replicate the record before acking. Combined with `min.insync.replicas>=2` and `replication.factor=3`, this is the standard durable configuration: tolerates one broker loss with zero data loss."},{"term":"acks=1","definition":"Producer setting where only the partition leader acknowledges the write before responding to the producer. If the leader crashes before followers replicate, the record is lost. Default in many older clients; tradeoff between latency and durability."},{"term":"enable.idempotence=true","definition":"Producer config that gives each producer a Producer ID (PID) and attaches a monotonic sequence number per partition. Brokers dedup retries by (PID, partition, seq), preventing duplicates on producer retries. Required for Kafka transactions and effectively free since Kafka 3.0 (now default)."},{"term":"Kafka transactions","definition":"Atomic multi-partition writes scoped to a `transactional.id`. The producer calls `initTransactions/beginTransaction/sendOffsetsToTransaction/commitTransaction`, and a transaction coordinator writes commit/abort markers to the __transaction_state topic. Enables exactly-once semantics for read-process-write loops in Kafka."},{"term":"isolation.level=read_committed","definition":"Consumer setting that hides records from open or aborted transactions, only delivering records up to the Last Stable Offset (LSO). Required on the consumer side to actually get exactly-once semantics from transactional producers."},{"term":"Kafka exactly-once semantics (EOS)","definition":"Achieved by combining idempotent producer (dedup on retries) + transactions (atomic multi-partition commit including consumer offsets) + `isolation.level=read_committed` consumer. Guarantees EOS only within Kafka — external side effects (DB writes, HTTP calls) still need their own idempotency."},{"term":"In-sync replicas (ISR)","definition":"The set of replicas for a partition that are caught up with the leader. A follower is kicked out of ISR if it hasn't fetched within `replica.lag.time.max.ms` (default 30s). Time-based — replaced the old `replica.lag.max.messages` because bursty producers caused false ISR shrinks."},{"term":"min.insync.replicas","definition":"Topic/broker setting that, combined with `acks=all`, defines the minimum ISR size required for a write to succeed. With RF=3 and min.insync.replicas=2, the cluster tolerates one broker loss; if ISR drops below 2, producers get NotEnoughReplicasException instead of silent data loss."},{"term":"Unclean leader election","definition":"When `unclean.leader.election.enable=true`, an out-of-ISR replica can be promoted to leader if all ISR members are unavailable. Restores availability but truncates committed data on the new leader. Default is false in modern Kafka — choose availability vs durability explicitly."},{"term":"Kafka controller","definition":"Exactly one broker in the cluster is elected controller. It manages partition leader elections, ISR changes, topic creation/deletion, and broker membership. In ZooKeeper-based clusters it was elected via ZK ephemeral nodes; in KRaft it's a quorum of controller nodes running Raft."},{"term":"KRaft mode","definition":"Kafka Raft Metadata mode: replaces ZooKeeper with an internal Raft quorum of controller nodes that store cluster metadata in a Kafka log (__cluster_metadata topic). Default and only supported mode in Kafka 4.0+; simplifies ops and lifts the ~200k partition ZK limit."},{"term":"Consumer group","definition":"A set of consumers sharing a `group.id` that cooperatively consume a topic. Each partition is assigned to exactly one consumer in the group; if there are more consumers than partitions, the extras sit idle. A group coordinator broker tracks membership and assignments."},{"term":"__consumer_offsets","definition":"Internal compacted Kafka topic (50 partitions by default) where consumer groups commit their offsets, keyed by (group, topic, partition). Compaction keeps only the last committed offset per key. The group coordinator for a group is the broker leading the partition of this topic that the group's ID hashes to."},{"term":"Auto-commit pitfall (enable.auto.commit=true)","definition":"Consumer periodically (every `auto.commit.interval.ms`, default 5s) commits the latest polled offsets in the background. If the consumer crashes after committing but before processing, records are lost; if it crashes before committing, records are reprocessed. Always at-least-once at best, never exactly-once."},{"term":"Cooperative rebalancing","definition":"Incremental rebalance protocol (cooperative-sticky assignor) where consumers only revoke partitions they're losing instead of all consumers dropping all partitions (\"stop-the-world\" eager rebalance). Drastically cuts rebalance pause time for large groups."},{"term":"Static group membership","definition":"Setting `group.instance.id` on a consumer makes it a static member. Short restarts (within `session.timeout.ms`) don't trigger a rebalance — the coordinator holds the partitions for the same instance ID. Essential for stateful consumers like Kafka Streams with large RocksDB stores."},{"term":"Sticky partition assignor","definition":"Consumer-group assignor that maximizes partition-to-consumer stickiness across rebalances while keeping assignments balanced. `cooperative-sticky` combines this with incremental rebalance. Compare to `range` (per-topic contiguous ranges) and `round-robin` (across all subscribed partitions)."},{"term":"Log compaction","definition":"Retention mode (`cleanup.policy=compact`) that keeps the most recent value for each key in a partition, deleting older versions during background compaction of older segments. A record with a null value is a tombstone, marking the key for deletion. Used for changelog topics, Kafka Streams state, and __consumer_offsets."},{"term":"Tombstone (Kafka)","definition":"A record with a non-null key and null value in a compacted topic. Signals that the key should be deleted; after `delete.retention.ms` the tombstone itself is also removed by the log cleaner. Required mechanism for deleting keys from compacted topics."},{"term":"Sticky partitioner","definition":"Default producer partitioning for records with no key (since Kafka 2.4 / replaced by `UniformStickyPartitioner` then `DefaultPartitioner` in 3.3+): batches stick to one partition until the batch is full or `linger.ms` elapses, then rotate. Improves batch fill vs the old round-robin partitioner."},{"term":"linger.ms","definition":"Producer config: how long to wait for additional records before sending a batch, even if `batch.size` isn't reached. Default 0 (send immediately). Raising it (e.g. 5-20ms) trades latency for much larger batches and better compression/throughput."},{"term":"batch.size","definition":"Producer config: maximum batch size in bytes per partition before sending. Default 16 KiB. Works with `linger.ms`: a batch flushes when either it fills or linger expires. Bigger batches improve throughput and compression ratio."},{"term":"Kafka producer compression","definition":"`compression.type` on the producer (none, gzip, snappy, lz4, zstd). Compression happens per batch, so larger batches compress better. zstd typically gives the best ratio/CPU tradeoff; lz4 is the fastest. Brokers store the compressed batch as-is unless the topic forces a different codec."},{"term":"Schema Registry compatibility modes","definition":"Confluent Schema Registry rules per subject: BACKWARD (new schema can read old data — default), FORWARD (old schema can read new data), FULL (both), plus *_TRANSITIVE variants that check against all previous versions, not just the last. Drives what changes are allowed when evolving Avro/Protobuf/JSON schemas."},{"term":"Schema Registry subject naming","definition":"Strategy that maps Kafka records to subjects. Default `TopicNameStrategy` uses `<topic>-key` and `<topic>-value`. `RecordNameStrategy` uses the fully qualified record name (lets multiple event types share a topic). `TopicRecordNameStrategy` combines both."},{"term":"Kafka Streams","definition":"JVM client library for stateful stream processing on Kafka. Stores local state in embedded RocksDB instances, backed by compacted changelog topics in Kafka for fault tolerance. Scales by partition count; no separate cluster — runs in your app process."},{"term":"Kafka Connect","definition":"Framework and runtime for moving data between Kafka and external systems via reusable Source connectors (DB → Kafka) and Sink connectors (Kafka → DB/object store). Runs as a cluster with REST API; handles offset tracking, restarts, and scaling tasks across workers."},{"term":"Tiered storage (KIP-405)","definition":"Kafka feature where older closed segments are offloaded from broker local disk to remote object storage (S3, GCS) while remaining transparently consumable. Decouples retention from broker disk size, enabling effectively infinite retention without bloating brokers."},{"term":"Partition reassignment tool","definition":"`kafka-reassign-partitions.sh`: generates and executes a JSON plan to move partition replicas across brokers. Used to rebalance after broker add/remove, recover from broker disk failure, or expand replication factor. Throttle with `replication-quota` to avoid saturating the network."},{"term":"Why Kafka is fast on sequential I/O","definition":"Each partition is an append-only log: producers append at the tail, consumers read sequentially via offset. Sequential disk writes hit OS page cache and approach memory bandwidth, and zero-copy `sendfile()` ships bytes from page cache to socket without userspace copies. Random I/O is avoided entirely."},{"term":"Pub/Sub topic vs subscription","definition":"In GCP Pub/Sub, publishers send to a topic; each subscription attached to that topic gets its own independent copy of every message with its own ack state. Adding a subscription fan-outs the stream — unlike Kafka where multiple consumer groups share the same log."},{"term":"Pub/Sub pull vs push subscription","definition":"Pull: subscriber calls `Pull`/streaming-pull to fetch messages and acks them. Push: Pub/Sub HTTP-POSTs each message to a configured HTTPS endpoint and treats a 2xx as an ack; retries with exponential backoff on non-2xx. Kafka, by contrast, is pull-only."},{"term":"Pub/Sub ack deadline","definition":"Default 10 seconds from delivery; if not acked by then, Pub/Sub redelivers. Subscribers can call `modifyAckDeadline` (or the client library does it via lease management) to extend up to a maximum of 10 minutes per message for long-running processing."},{"term":"Pub/Sub ordering keys","definition":"To get ordering, the topic must have message ordering enabled and publishers must set an ordering key on each message. Messages with the same ordering key are delivered in publish order to a single subscriber, and only within a single GCP region. Off by default."},{"term":"Pub/Sub exactly-once delivery","definition":"Per-subscription feature: within a configurable ack deadline window, Pub/Sub guarantees no redelivery of an acked messag
