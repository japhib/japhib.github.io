e and provides an `AckResponse` to confirm the ack was persisted. Doesn't cover publisher-side dedup — use message IDs or idempotent processing for that."},{"term":"Pub/Sub dead letter topic","definition":"Per-subscription config: after `max_delivery_attempts` failed delivery attempts (5-100), the message is forwarded to a designated dead-letter topic instead of being redelivered forever. Requires the Pub/Sub service account to have publish rights on the DLQ topic."},{"term":"Pub/Sub snapshots and seek","definition":"Snapshots capture a subscription's ack state at a point in time (retained up to 7 days); `Seek` rewinds a subscription to a snapshot or to a timestamp (within the topic's `message_retention_duration`, default 7 days, max 31 days), causing redelivery. Pub/Sub's analog to Kafka offset reset."},{"term":"Pub/Sub subscription filtering","definition":"A subscription can carry a filter expression over message attributes (e.g. `attributes.region = \"us\"`); only matching messages are delivered. Filtered-out messages are auto-acked and not billed for delivery, but storage still applies on the topic side."},{"term":"Pub/Sub vs Kafka offset management","definition":"Kafka stores consumer offsets externally (in __consumer_offsets) and the consumer pulls from any offset it chooses — replays are trivial. Pub/Sub manages ack state server-side per subscription; consumers ack individual messages and cannot freely seek backward except via snapshots/seek-to-time within retention."},{"term":"Pub/Sub vs Kafka retention model","definition":"Kafka retention is per topic via `retention.ms` and `retention.bytes` (or compaction) and can be effectively infinite with tiered storage. Pub/Sub retains messages on the topic for `message_retention_duration` (default 7 days, max 31) and on a subscription only until ack — there's no log to scan after that."}]},{"name":"Networking","cards":[{"term":"TCP three-way handshake","definition":"SYN → SYN-ACK → ACK. Client sends SYN with initial sequence number X. Server replies SYN-ACK with its own sequence Y and ACK X+1. Client ACKs Y+1. Establishes bidirectional sequence-number sync before any data flows."},{"term":"TLS 1.3 handshake","definition":"1-RTT (0-RTT with a pre-shared key). ClientHello includes a key share; ServerHello replies with its key share, and everything after is encrypted — including the certificate. Drops RSA key exchange and other non-forward-secret modes."},{"term":"HTTP/2 multiplexing","definition":"Many concurrent streams over a single TCP connection, each with a unique stream ID; frames from different streams are interleaved. Removes HTTP/1.1's connection-per-request limit but still suffers TCP-level head-of-line blocking — HTTP/3 fixes that with QUIC over UDP."},{"term":"Head-of-line blocking","definition":"A stalled item at the front of a queue holds up everything behind it. In HTTP/1.1 pipelining, a slow response blocks the rest. At the TCP layer, one lost packet blocks every higher-layer stream on that connection until it's retransmitted. HTTP/3 (QUIC) sidesteps the TCP variant."},{"term":"TCP slow start","definition":"Congestion window (cwnd) starts at ~10 MSS (RFC 6928) and doubles each RTT — exponential growth — until it hits ssthresh or detects loss. Probes capacity quickly on a new connection; the reason short HTTP transfers never reach link bandwidth."},{"term":"Fast retransmit","definition":"On receiving 3 duplicate ACKs for the same sequence number, the sender retransmits the apparently lost segment immediately instead of waiting for the RTO timer. Cuts recovery latency from hundreds of ms to roughly one RTT."},{"term":"SACK (Selective Acknowledgement)","definition":"TCP option (RFC 2018) letting the receiver tell the sender exactly which non-contiguous byte ranges have arrived. Without it, a sender hitting a gap must retransmit everything after the loss; with it, only the actual missing segments are resent."},{"term":"Nagle's algorithm","definition":"Buffer small writes until either a full MSS is available or all prior data has been ACKed, then send. Reduces tinygram overhead (e.g. one-byte Telnet keystrokes) but adds latency for chatty interactive protocols. Disabled per-socket with TCP_NODELAY."},{"term":"Nagle + delayed-ACK interaction","definition":"Sender holds a small write waiting for an ACK; receiver holds the ACK waiting for data to piggyback on. Both stall until the delayed-ACK timer (~40 ms on Linux) fires. Classic cause of mysterious 40 ms latency spikes on request/response protocols — fix with TCP_NODELAY."},{"term":"TCP_NODELAY","definition":"Socket option that disables Nagle's algorithm so small writes are sent immediately. Standard for latency-sensitive RPC and interactive protocols; redis-cli, gRPC, and most databases enable it."},{"term":"TCP keepalive","definition":"Optional probes sent on an idle connection (Linux default: after 2 hours idle, 9 probes 75s apart) to detect dead peers or stale NAT mappings. Applications usually set their own shorter timers; matters because NAT/firewall flow tables often expire idle TCP in 5-30 min."},{"term":"TIME_WAIT state","definition":"End that sends the final ACK of an active close holds the socket for 2×MSL (typically 60 s on Linux) to absorb stray retransmits and prevent old segments from being interpreted as part of a new connection on the same 4-tuple. Cause of ephemeral port exhaustion on busy clients."},{"term":"TCP FIN vs RST","definition":"FIN is a graceful half-close — \"I'm done sending\" — that drains buffered data and walks through FIN_WAIT/CLOSE_WAIT/TIME_WAIT. RST is an abort that immediately tears the connection down and discards unread data; sent on closesocket with SO_LINGER 0 or when a packet arrives for no known socket."},{"term":"Ephemeral port exhaustion","definition":"Outbound connections draw source ports from a finite range (Linux default 32768-60999, ~28k ports). Combined with TIME_WAIT holding sockets ~60 s, a client doing >~450 conns/sec to the same dest 4-tuple runs out. Mitigate with connection pooling, SO_REUSEADDR, or widening net.ipv4.ip_local_port_range."},{"term":"TCP CUBIC","definition":"Linux's default loss-based congestion control since 2.6.19. cwnd follows a cubic function of time since the last congestion event, growing aggressively far from Wmax and gently near it. RTT-independent — fairer than classic Reno across heterogeneous latencies and the reason large transfers don't crawl on transcontinental links."},{"term":"TCP BBR","definition":"Google's congestion control that models the bottleneck Bandwidth and Round-trip propagation time, then paces sending at BDP rather than reacting to packet loss. Maintains high throughput on lossy links (e.g. wireless, transatlantic) where CUBIC collapses, but can be unfair to loss-based flows sharing a bottleneck."},{"term":"MSS","definition":"Maximum Segment Size — largest TCP payload per segment, advertised in the SYN. Equals MTU minus IP and TCP headers (1500 − 20 − 20 = 1460 typical IPv4). Tuned down to ~1400 on tunnels/VPNs to avoid PMTUD blackholes."},{"term":"Path MTU Discovery (PMTUD)","definition":"Sender sets DF (Don't Fragment); routers that can't forward respond with ICMP \"Fragmentation Needed\" carrying the next-hop MTU. Sender shrinks segments accordingly. Breaks when ICMP is filtered (\"PMTUD blackhole\") — symptom is handshake works but large transfers stall."},{"term":"When UDP wins over TCP","definition":"No handshake, no head-of-line blocking, no congestion-control floor, app-controlled retransmit policy. Right choice for DNS, VoIP/RTP, gaming, multicast, and as the substrate for QUIC where the app implements its own ordering and reliability."},{"term":"TLS certificate chain","definition":"Leaf cert signed by an intermediate CA, intermediate signed by a root CA in the client's trust store. Server sends leaf + intermediates in the handshake; the client walks the chain validating signatures and checks revocation. Missing intermediates is a common \"works in browser, fails in curl\" cause."},{"term":"OCSP stapling","definition":"Server fetches a signed, timestamped OCSP response from its CA and attaches (\"staples\") it to the TLS handshake's CertificateStatus message. Client skips its own OCSP lookup — saves a round trip and avoids leaking browsing history to the CA."},{"term":"SNI (Server Name Indication)","definition":"TLS extension where the client sends the target hostname in cleartext in ClientHello so the server can pick the right certificate among many on one IP. Required for HTTPS virtual hosting; ESNI/ECH encrypts it to close the metadata leak."},{"term":"ALPN","definition":"Application-Layer Protocol Negotiation — TLS extension where the client offers a list (e.g. \"h2\", \"http/1.1\") in ClientHello and the server picks one. How a browser and server agree to speak HTTP/2 without an extra round trip."},{"term":"TLS session resumption","definition":"Skips the full handshake on reconnect using either a session ID (server-side cache) or a session ticket (RFC 5077, opaque blob the client stores and replays). Both yield a 1-RTT handshake in TLS 1.2 and enable 0-RTT in TLS 1.3."},{"term":"TLS 0-RTT replay risk","definition":"TLS 1.3 lets the client send application data in the first flight using a pre-shared key from a prior session — zero round trips. Same ciphertext can be replayed by an attacker, so only idempotent GET-like requests should use it; never POSTs that mutate state."},{"term":"mTLS","definition":"Mutual TLS — server requests a CertificateRequest in the handshake, client presents its own cert and proves possession of the private key via CertificateVerify. Used for service mesh (Istio, Linkerd) identity and for B2B APIs replacing API keys."},{"term":"HPACK","definition":"HTTP/2 header compression (RFC 7541). Combines a static table of common headers, a dynamic table updated as headers are sent, and Huffman coding of literals. Designed to resist CRIME-style compression attacks by not mixing client-controlled and secret data in one compression context."},{"term":"QUIC","definition":"UDP-based transport underlying HTTP/3 (RFC 9000). Provides multiple ordered byte streams with independent loss recovery (no TCP HOL blocking), built-in TLS 1.3, 1-RTT or 0-RTT setup, and connection migration via a Connection ID so a phone switching Wi-Fi → LTE keeps the session."},{"term":"QUIC connection migration","definition":"QUIC connections are keyed by a 64+ bit Connection ID rather than the 4-tuple, so an endpoint can change IP/port (NAT rebind, Wi-Fi to cellular) and continue the same session. TCP can't do this — a 4-tuple change always means a new connection."},{"term":"DNS recursive vs authoritative resolver","definition":"Recursive resolver (e.g. 8.8.8.8, your ISP) walks the hierarchy on behalf of the client, caches, and returns a final answer. Authoritative servers own a zone and return only records they're responsible for. Recursive queries root → TLD → authoritative, caching each step per its TTL."},{"term":"DNSSEC","definition":"DNS records signed with per-zone keys (RRSIG), with public keys (DNSKEY) authenticated up the delegation chain via DS records anchored at the root. Validates record authenticity but not confidentiality — doesn't encrypt; that's DoT/DoH."},{"term":"Cookie SameSite attribute","definition":"Controls cross-site sending. Strict — never sent on cross-site requests. Lax (modern default) — sent only on top-level GET navigations. None — sent on all cross-site requests but requires Secure. Primary defense against CSRF."},{"term":"CORS preflight","definition":"For non-simple cross-origin requests (custom headers, methods other than GET/HEAD/POST, non-form content types) the browser sends OPTIONS first carrying Access-Control-Request-Method/Headers; server responds with Access-Control-Allow-* headers. Cached per Access-Control-Max-Age."},{"term":"CORS credentials + wildcard rule","definition":"If the request carries credentials (cookies, Authorization), the server must echo a specific origin in Access-Control-Allow-Origin — wildcard \"*\" is forbidden — and also send Access-Control-Allow-Credentials: true. Prevents any-origin CSRF-with-cookies via lazy \"*\" configs."},{"term":"L4 vs L7 load balancer","definition":"L4 forwards TCP/UDP by 4-tuple — fast, protocol-agnostic, can't see HTTP path/headers, can't terminate TLS without proxying. L7 parses the application protocol, can route by URL/host/header, do TLS termination, retries, header rewriting, but costs more CPU per request. Examples: AWS NLB (L4), ALB/Envoy/HAProxy http mode (L7)."},{"term":"Consistent hashing","definition":"Hash both keys and N nodes onto a ring; a key goes to the next node clockwise. Adding or removing a node only reshuffles ~1/N of keys instead of all of them. Used by memcached client routing, Cassandra, DynamoDB, and load balancers for sticky-by-key routing."},{"term":"STUN vs TURN","definition":"STUN — a public server that tells a NATed client its observed public IP:port so peers can try direct UDP. TURN — a relay server that forwards traffic when direct traversal fails (symmetric NATs, restrictive firewalls). WebRTC tries STUN first, falls back to TURN."},{"term":"Anycast","definition":"One IP prefix announced from many locations via BGP; the network's shortest-path routing delivers each client to the topologically nearest instance. Used by the 13 DNS root servers, public resolvers (1.1.1.1, 8.8.8.8), and global LBs like Cloudflare and AWS Global Accelerator."},{"term":"BGP","definition":"Border Gateway Protocol — the exterior routing protocol that stitches the internet together. Autonomous Systems (ASes, e.g. AS15169 = Google) announce which IP prefixes they originate or transit; path selection is policy-driven (shortest AS_PATH plus LOCAL_PREF, MED). Hijacks happen because trust is largely manual — RPKI helps."},{"term":"SO_REUSEADDR vs SO_REUSEPORT","definition":"SO_REUSEADDR lets a new listener bind the same address while a previous socket is in TIME_WAIT. SO_REUSEPORT (Linux 3.9+) lets multiple processes/threads bind the exact same address:port simultaneously, with the kernel load-balancing incoming connections across them — used by nginx/Envoy multi-worker setups."},{"term":"TCP listen backlog / accept queue","definition":"The kernel keeps two queues per listener — SYN queue (half-open, awaiting final ACK) and accept queue (fully established, awaiting accept()). listen()'s backlog caps the accept queue; overflow drops new SYNs or RSTs them. Tunable via net.core.somaxconn; a backed-up accept queue shows as latency, not errors."},{"term":"BDP (bandwidth-delay product)","definition":"Bytes \"in flight\" needed to saturate a link = bandwidth × RTT. A 1 Gbps link with 100 ms RTT needs ~12.5 MB of in-flight data; if the TCP receive window is smaller, throughput caps below line rate regardless of CPU. Reason for window-scaling (RFC 7323) and large kernel buffers on long-fat networks."}]},{"name":"Sharding","cards":[{"term":"Sharding vs partitioning vs replication","definition":"Partitioning splits one logical dataset into disjoint pieces; sharding is partitioning where each piece lives on a separate node (horizontal scaling). Replication copies the same data to multiple nodes for HA and read scaling. Sharding scales writes/storage; replication scales reads/availability — they're orthogonal and usually combined."},{"term":"Hash sharding","definition":"Apply a hash function to the shard key and map the result (often via modulo or consistent hashing) to a shard. Produces uniform load distribution and kills hotspots from sequential keys, but destroys key locality so range scans must scatter-gather across every shard."},{"term":"Range sharding","definition":"Assign contiguous key ranges to shards (e.g., A-F on shard 1, G-M on shard 2). Range scans and ORDER BY on the shard key stay on one or two shards, but skewed key distributions or monotonic inserts create hot ranges that need manual or automatic splits. Used by HBase, Bigtable, Spanner, CockroachDB."},{"term":"Directory-based sharding","definition":"A lookup service maps each key (or key range) to a shard explicitly, e.g., a config table or ZooKeeper-stored map. Maximally flexible — you can pin tenants, rebalance one key at a time — but the directory becomes a critical dependency and a potential bottleneck or SPOF on every routed query."},{"term":"Geographic sharding","definition":"Partition data by user/region (EU users on EU shard, US on US shard) to satisfy data residency (GDPR), reduce latency, and localize blast radius. Painful for users who travel or cross-region queries; usually combined with regional read replicas."},{"term":"Entity-group sharding (Spanner-style)","definition":"Co-locate related rows (e.g., all rows for one customer) into one shard/partition so transactions and joins within an entity group stay single-shard and cheap. Megastore and Spanner formalized this; Spanner's INTERLEAVE IN PARENT physically nests child rows next to the parent row."},{"term":"Shard key cardinality requirement","definition":"The shard key must have far more distinct values than the number of shards — otherwise data can't spread. A boolean or country-code key (~200 values) is a classic bad pick; you want millions of distinct values so chunks can split indefinitely as data grows."},{"term":"Shard key frequency requirement","definition":"Even with high cardinality, the distribution of key values across documents/rows must be roughly uniform. If 90% of writes carry tenant_id=BIGCORP, that one value pins load to one shard regardless of how many other tenants exist."},{"term":"Why monotonically increasing shard keys are bad","definition":"Keys like auto-increment IDs or timestamps always land in the current \"max\" range or hash bucket, so every write goes to one shard while the others sit idle. Classic write hotspot. Mitigations: hash the key, reverse it, or prefix with a random/hash salt (write sharding)."},{"term":"Query-pattern alignment for shard keys","definition":"Pick a shard key your high-QPS queries already filter by, so the router sends each query to one shard. If most reads filter by user_id but you shard by post_id, every \"get user's posts\" becomes a scatter-gather. Wrong shard key is the most expensive mistake to fix later."},{"term":"Scatter-gather query","definition":"A query that doesn't include the shard key, so the router fans it out to every shard and merges results. Latency follows the slowest shard (tail amplification), so p99 gets worse as shard count grows. Acceptable for low-QPS analytics, fatal for hot paths."},{"term":"Local secondary index (sharded DB)","definition":"Index built independently on each shard, covering only that shard's rows. Writes are cheap (one shard touched) but reads on the indexed column without the shard key require scatter-gather. Default in DynamoDB LSIs, Cassandra secondary indexes, Mongo non-shard-key indexes."},{"term":"Global secondary index (sharded DB)","definition":"A single index spanning all shards, partitioned by the indexed column (its own sharding scheme). Reads on the indexed column hit one shard, but every write must update both the base table shard and the index shard — often asynchronously, yielding eventual consistency. DynamoDB GSIs work this way."},{"term":"Compound shard key","definition":"A shard key composed of multiple fields, e.g., (tenant_id, created_at). Helps when one field alone is too low-cardinality or too skewed — adding a finer-grained suffix lets chunks split further. Hurts if queries only filter by the trailing fields, since those become scatter-gather."},{"term":"Celebrity / hot-key problem","definition":"A single key receives orders of magnitude more traffic than others (Justin Bieber's Twitter followers, a viral product page). No amount of resharding helps because the hot value still hashes to one shard. Mitigated by application-level caching, sub- sharding the hot key, or write sharding with a random suffix."},{"term":"Key salting / write sharding","definition":"Prefix or suffix the shard key with a small random value (0..N-1), turning one hot key into N synthetic keys spread across shards. Reads must fan out to all N variants and merge. Used in HBase to spread time-series writes and in DynamoDB for hot partition mitigation."},{"term":"Resharding (online)","definition":"Splitting or moving shards while serving traffic. Standard pattern: presplit empty target shards, double-write to old and new, backfill historical data, verify, then cut reads over and stop double-writes. Cheap with consistent hashing, expensive with naive modulo because nearly every key moves."},{"term":"Why naive modulo (hash % N) sharding is hard to rebalance","definition":"Adding one shard changes N, so ~N/(N+1) of all keys remap to a different shard — you essentially have to move the whole dataset. Consistent hashing or jump hash bounds the moved fraction to ~K/N, which is why production systems avoid plain modulo."},{"term":"Consistent hashing (sharding context)","definition":"Hash both keys and shards onto a ring; each key goes to the next shard clockwise. Adding/removing a shard only relocates keys in its neighbor's arc, so resharding moves O(K/N) keys instead of nearly all of them. Underpins DynamoDB, Cassandra, Riak, and most modern distributed caches."},{"term":"Application-level sharding","definition":"The client/application computes the target shard and connects directly to it. Minimal latency overhead and no proxy to operate, but every service must embed the shard map and topology-change logic, and polyglot clients diverge. Common with Postgres/MySQL fleets before adopting Vitess."},{"term":"Proxy-based sharding","definition":"A dedicated routing layer (Vitess vtgate, ProxySQL, Citus coordinator) parses SQL, figures out which shards to hit, and merges results. Clients speak the normal wire protocol unaware of sharding. Adds a hop and a critical component to operate, but centralizes shard logic."},{"term":"Database-native sharding","definition":"The database itself handles partitioning, routing, and rebalancing — MongoDB, Cassandra, DynamoDB, Spanner. Operationally simpler than bolt-on sharding but you inherit its key model (partition key + clustering key) and its limitations on cross-shard queries."},{"term":"MongoDB shard key immutability","definition":"Pre-4.2 the shard key value of a document could never change; 4.2 allowed updates, and 5.0 introduced refinable shard keys (you can add suffix fields to the key itself). Changing the key field set still requires resharding. This is why picking it right initially matters so much."},{"term":"MongoDB chunk","definition":"The unit of data movement in a sharded Mongo cluster — a contiguous range of shard key values, default 128 MB. The balancer migrates chunks between shards to even out load. Chunks split automatically as they grow past the threshold."},{"term":"MongoDB jumbo chunk","definition":"A chunk that has grown beyond the configured size but can't be split because every document in it shares the same shard key value (low cardinality / hot key). The balancer skips it, so load stays uneven. Fixing it requires changing the shard key — historically painful, eased by 5.0 reshardCollection."},{"term":"MongoDB config servers","definition":"A dedicated replica set that stores the cluster's shard map (which chunks live on which shards) and metadata. mongos query routers cache this map and route queries accordingly; loss of config-server quorum freezes metadata changes but reads still serve from cached routing tables."},{"term":"Vitess vindex","definition":"Vitess's pluggable mapping from a logical column value to a keyspace ID, which then maps to a shard. Hash vindexes give uniform distribution; lookup vindexes maintain a separate table (often in MySQL) mapping values to keyspace IDs — used when you need a secondary access path or to pin specific values."},{"term":"Cassandra/DynamoDB partition vs clustering key","definition":"The partition key is hashed to choose a node (analogous to shard key); the clustering/sort key orders rows within that partition for cheap range scans. So PRIMARY KEY ((user_id), created_at DESC) puts all of one user's events on one node, sorted newest-first — fast user timelines, no cross-partition reads."},{"term":"DynamoDB hot partition limits","definition":"Per partition: 10 GB storage, 3000 RCU, 1000 WCU. Hitting any limit triggers adaptive capacity (briefly steals from cold partitions) and eventually a partition split. Sustained hotspotting still throttles — you need write sharding or a better partition key."},{"term":"Pooled vs siloed vs bridge multi-tenancy","definition":"Pooled: all tenants share one DB/schema, tenant_id column on every row — cheapest, noisy-neighbor risk. Siloed: one DB per tenant — strong isolation and per-tenant backup/restore, expensive at scale. Bridge: one schema per tenant in a shared DB — middle ground, common in B2B SaaS."},{"term":"Pinned-shard / tenant-pinning pattern","definition":"Route all of one tenant's (or user's) data to a specific shard via a directory lookup, so their queries, joins, and transactions stay single-shard. Lets big customers get dedicated capacity and lets you move one tenant at a time during rebalancing. Common in B2B SaaS sharding."},{"term":"Cross-shard transaction options","definition":"Three pragmatic choices: (1) two-phase commit across shards — correct but slow and blocking on coordinator failure, (2) Saga with compensating actions — eventually consistent, app-level rollback, (3) design the shard key so transactions are always single-shard (entity groups) — fastest, what most large systems pick."},{"term":"Cross-shard joins","definition":"Native JOINs across shards either don't exist or fan out and merge expensively. Standard fixes: denormalize the joined data into the same shard, do the join in the application layer with two queries, or replicate small dimension tables to every shard (\"reference tables\" in Citus)."},{"term":"Snowflake ID (sharded ID generation)","definition":"64-bit ID = timestamp (41 bits) + node/worker ID (10 bits) + per-ms sequence (12 bits). Roughly time-sortable for index locality, generated locally without coordination, globally unique. Tradeoff: the leading timestamp still creates write hotspots in B-tree indexes — UUIDv4 avoids hotspots but kills locality."},{"term":"ULID vs UUIDv4 for sharded systems","definition":"ULID = 48-bit timestamp + 80 bits random; lexicographically sortable so it gives index locality like Snowflake but without coordinated node IDs. UUIDv4 is fully random — great for hash sharding, no hotspots, but every insert hits a random page of the index, hurting write throughput on B-trees."},{"term":"Routing layer stale shard map","definition":"The router (mongos, vtgate, custom client) caches the shard map; if a chunk moves and the cache isn't invalidated, queries hit the wrong shard. Systems handle this via version-stamped maps where the shard rejects mismatched requests with a \"retarget\" error, forcing a refresh."},{"term":"Split-brain shard ownership","definition":"Two shards both believe they own the same key range, usually after a botched migration or a network partition during chunk move. Result: divergent writes, lost data on reconciliation. Prevented by epoch/version numbers on ownership and by requiring config-server / coordinator acknowledgement before serving a range."},{"term":"Read replicas vs sharding","definition":"Read replicas duplicate the full dataset to scale read QPS; sharding splits the dataset to scale writes, storage, and working-set memory. Orthogonal: most production systems shard, then add read replicas per shard. A single primary capped on writes/IOPS isn't fixed by adding more replicas."},{"term":"Sharding for storage vs for throughput","definition":"Storage-driven sharding (dataset > one node's disk) tolerates uneven QPS as long as bytes spread evenly. Throughput-driven sharding (write QPS > one node's IOPS) demands uniform request distribution, which pushes you toward hash sharding and write-sharding hot keys. Same tool, different key strategy."},{"term":"Shard rebalancing data movement cost","definition":"Moving a shard's worth of data over the network competes with live traffic for IOPS, CPU, and bandwidth, and the source must keep serving while copying. This is why minimal-movement schemes (consistent hashing, jump hash, range splits) win over recomputed modulo, and why operators throttle balancer bandwidth."},{"term":"Presplitting shards","definition":"Before bulk-loading or expecting a write burst, manually create empty chunks/ regions across all shards so writes spread immediately. Without it, HBase/Mongo/ DynamoDB start with one chunk on one node and only split after hotspotting manifests — by which point you've already taken the latency hit."}]}]};

const STORAGE_KEY = 'flashcards-v1';

const state = {
  view: 'categories',
  selectedCategories: new Set(),
  deck: [],
  index: 0,
  flipped: false,
  sessionResults: [],
};

function loadStats() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch (e) { return {}; }
}
function saveStats(stats) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(stats));
}
function cardId(card) {
  return card.category + '::' + card.term;
}
function recordResult(card, correct) {
  const stats = loadStats();
  const id = cardId(card);
  if (!stats[id]) stats[id] = { correct: 0, incorrect: 0 };
  if (correct) stats[id].correct++; else stats[id].incorrect++;
  stats[id].lastSeen = Date.now();
  saveStats(stats);
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function buildDeck(selected) {
  const cards = [];
  for (const cat of FLASHCARD_DATA.categories) {
    if (!selected.has(cat.name)) continue;
    for (const c of cat.cards) {
      cards.push({
        category: cat.name,
        term: c.term,
        definition: (c.definition || '').trim(),
        // disabling showing definition first for now
        showTerm: true,// Math.random() < 0.5,
      });
    }
  }
  return shuffle(cards);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function render() {
  const app = document.getElementById('app');
  if (state.view === 'categories') return renderCategories(app);
  if (state.view === 'cards') return renderCard(app);
  if (state.view === 'done') return renderDone(app);
}

function renderCategories(app) {
  const stats = loadStats();
  let html = '<h1>Flashcards</h1>';
  html += '<p class="lede">Pick one or more categories to study.</p>';
  html += '<form id="cat-form">';
  for (const cat of FLASHCARD_DATA.categories) {
    let correct = 0, total = 0;
    for (const c of cat.cards) {
      const s = stats[cat.name + '::' + c.term];
      if (s) { correct += s.correct; total += s.correct + s.incorrect; }
    }
    const rate = total > 0 ? Math.round(100 * correct / total) + '% · ' + total + ' attempt' + (total === 1 ? '' : 's') : 'no attempts yet';
    html += '<label class="cat">'
      + '<input type="checkbox" name="cat" value="' + escapeHtml(cat.name) + '">'
      + '<span><span class="cat-name">' + escapeHtml(cat.name) + '</span>'
      + '<span class="cat-meta">' + cat.cards.length + ' cards · ' + rate + '</span></span>'
      + '</label>';
  }
  html += '</form>';
  html += '<button id="start" class="primary" disabled>Start session</button>';
  app.innerHTML = html;

  const form = document.getElementById('cat-form');
  const startBtn = document.getElementById('start');
  form.addEventListener('change', () => {
    startBtn.disabled = form.querySelectorAll('input[name=cat]:checked').length === 0;
  });
  startBtn.addEventListener('click', () => {
    const checked = form.querySelectorAll('input[name=cat]:checked');
    const cats = new Set(Array.from(checked).map(i => i.value));
    state.selectedCategories = cats;
    state.deck = buildDeck(cats);
    state.index = 0;
    state.flipped = false;
    state.sessionResults = [];
    state.view = state.deck.length === 0 ? 'categories' : 'cards';
    render();
  });
}

function renderCard(app) {
  const card = state.deck[state.index];
  const showTerm = state.flipped ? !card.showTerm : card.showTerm;
  const text = showTerm ? card.term : card.definition;
  const label = showTerm ? 'Term' : 'Definition';
  const remaining = state.deck.length - state.index - 1;

  let html = '<div class="progress">'
    + '<span>Card ' + (state.index + 1) + ' of ' + state.deck.length + ' · ' + remaining + ' left</span>'
    + '<span class="cat-tag">' + escapeHtml(card.category) + '</span>'
    + '</div>';
  html += '<div class="card' + (state.flipped ? ' flipped' : '') + '">'
    + '<div class="face-label">' + label + '</div>'
    + '<div class="face-content' + (showTerm ? ' is-term' : '') + '">' + escapeHtml(text) + '</div>'
    + '</div>';

  if (!state.flipped) {
    html += '<div class="actions"><button id="flip" class="primary">Flip</button></div>';
    html += '<div class="hint">Press any key to flip</div>';
  } else {
    html += '<div class="actions">'
      + '<button id="incorrect">Incorrect</button>'
      + '<button id="correct">Correct</button>'
      + '</div>';
    html += '<div class="hint"><kbd>J</kbd> incorrect · <kbd>K</kbd> correct</div>';
  }
  html += '<button id="quit" class="quit">Quit session</button>';
  app.innerHTML = html;

  if (!state.flipped) {
    document.getElementById('flip').addEventListener('click', flip);
  } else {
    document.getElementById('incorrect').addEventListener('click', () => answer(false));
    document.getElementById('correct').addEventListener('click', () => answer(true));
  }
  document.getElementById('quit').addEventListener('click', () => {
    state.view = 'categories';
    render();
  });
}

function flip() {
  if (state.flipped) return;
  state.flipped = true;
  render();
}

function answer(correct) {
  const card = state.deck[state.index];
  recordResult(card, correct);
  state.sessionResults.push({ card, correct });
  state.index++;
  state.flipped = false;
  if (state.index >= state.deck.length) state.view = 'done';
  render();
}

function renderDone(app) {
  const correct = state.sessionResults.filter(r => r.correct).length;
  const total = state.sessionResults.length;
  const pct = total > 0 ? Math.round(100 * correct / total) : 0;

  let html = '<h1>Session complete</h1>';
  html += '<div class="summary-stat">' + correct + ' / ' + total + ' correct · ' + pct + '%</div>';

  const missed = state.sessionResults.filter(r => !r.correct);
  if (missed.length > 0) {
    html += '<h2>Cards to revisit</h2><ul class="missed">';
    for (const r of missed) {
      html += '<li><strong>' + escapeHtml(r.card.term) + '</strong>'
        + escapeHtml(r.card.definition) + '</li>';
    }
    html += '</ul>';
  }
  html += '<button id="back" class="primary">Back to categories</button>';
  app.innerHTML = html;
  document.getElementById('back').addEventListener('click', () => {
    state.view = 'categories';
    render();
  });
}

document.addEventListener('keydown', (e) => {
  if (state.view !== 'cards') return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.repeat) return;
  if (e.key === 'Tab') return;

  if (!state.flipped) {
    e.preventDefault();
    flip();
    return;
  }
  const k = e.key.toLowerCase();
  if (k === 'k' || e.key === 'ArrowRight') {
    e.preventDefault();
    answer(true);
  } else if (k === 'j' || e.key === 'ArrowLeft') {
    e.preventDefault();
    answer(false);
  }
});

render();
</script>
</body>
</html>
